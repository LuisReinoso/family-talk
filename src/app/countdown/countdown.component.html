<ft-header
  title="Reuniones familiares"
  [showConfig]="true"
  configLabel="{{ 'countdown.configure' | translate }}"
  (configClick)="navigateConfigs()"
></ft-header>

<div class="container">
  <!-- No player selected -->
  <ng-container *ngIf="!selectedPlayer">
    <app-player-grid
      [players]="players"
      [selectedUserId]="selectedUserId"
      (playerClick)="showPlayerAlert = true"
    ></app-player-grid>
  </ng-container>

  <!-- Player selected: question-centric, grid collapses to strip -->
  <ng-container *ngIf="selectedPlayer">
    <div class="game-area">
      <app-timer
        [player]="selectedPlayer"
        [isRunning]="isTimerRunning"
        [isSelecting]="isSelectingRandomUser"
        (pauseClick)="stopCountdown()"
        (resumeClick)="startCountdown()"
      ></app-timer>

      <ft-question-card
        [questionText]="selectedQuestion$ | async"
        [label]="'countdown.question' | translate"
        [depth]="currentDepth"
        [appreciation]="isAppreciation"
        [answer]="currentAnswer"
        [answerRevealed]="answerRevealed"
        [revealLabel]="'countdown.revealAnswer' | translate"
        [answerLabel]="'countdown.answerLabel' | translate"
        (reveal)="revealAnswer()"
      >
        <div *ngIf="!(selectedQuestion$ | async)" class="reset-action"
          (click)="resetLocalStorage()"
        >
          {{ "countdown.resetData" | translate }}
        </div>
        <ng-container slot="actions">
          <ng-container *ngIf="hasToUseAi$ | async; else localQuestionsTemplate">
            <ft-action-button
              *ngIf="openAiToken"
              icon="🤖"
              [text]="'countdown.generateQuestionWithAi' | translate"
              variant="ai"
              [loading]="isLoadingQuestion"
              (actionClick)="generateRandomQuestion()"
            ></ft-action-button>
          </ng-container>
          <ng-template #localQuestionsTemplate>
            <ft-action-button
              icon="↻"
              [text]="'countdown.changeQuestion' | translate"
              variant="ghost"
              (actionClick)="selectRandomQuestion()"
            ></ft-action-button>
          </ng-template>
        </ng-container>
      </ft-question-card>
    </div>

    <app-player-grid
      [players]="players"
      [selectedUserId]="selectedUserId"
      [compact]="true"
      (playerClick)="showPlayerAlert = true"
    ></app-player-grid>
  </ng-container>
</div>

<section class="footer">
  <div class="footer__stack">
    <div class="footer__hint" *ngIf="!selectedPlayer">
      {{ "countdown.pressOn" | translate }} 🔀 {{ "countdown.toStart" | translate }}
    </div>
    <ft-button
      variant="primary"
      size="lg"
      icon="🔀"
      (buttonClick)="selectRandomUserAndStart()"
    >
      {{ "countdown.selectPlayer" | translate }}
    </ft-button>
  </div>
</section>

<ft-alert
  *ngIf="showAiErrorAlert"
  variant="error"
  [dismissible]="true"
  (dismissed)="showAiErrorAlert = false"
>
  {{ "countdown.aiTokenError" | translate }}
</ft-alert>
