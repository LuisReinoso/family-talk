<ft-header [title]="'generalSettings.generalSettings' | translate"></ft-header>

<div class="page-content">
  <ft-card padding="lg">
    <div class="option-list">
      <ft-button variant="info" size="lg" (buttonClick)="resetPlayersTimer()" eventName="reset-players-timer" data-testid="btn-reset-timers">
        {{ "generalSettings.resetPlayersTimer" | translate }}
      </ft-button>
    </div>
  </ft-card>
</div>

<div class="page-footer">
  <ft-button variant="primary" (buttonClick)="backToGame()">{{ "common.return" | translate }}</ft-button>
</div>
