<ft-header [title]="'generalSettings.generalSettings' | translate"></ft-header>

<div class="page-content">
  <div class="settings-panel">
    <div class="settings-row">
      <div class="settings-row__text">
        <div class="settings-row__title">{{ "generalSettings.resetPlayersTimer" | translate }}</div>
        <div class="settings-row__helper">{{ "generalSettings.resetPlayersTimerHelper" | translate }}</div>
      </div>
      <ft-button
        variant="info"
        size="sm"
        (buttonClick)="resetPlayersTimer()"
        eventName="reset-players-timer"
        data-testid="btn-reset-timers"
      >
        {{ "common.reset" | translate }}
      </ft-button>
    </div>
  </div>
</div>

<section class="footer">
  <ft-button variant="primary" (buttonClick)="backToGame()">{{ "common.return" | translate }}</ft-button>
</section>
