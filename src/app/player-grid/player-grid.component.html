<section
  class="players"
  (click)="playerClick.emit()"
  eventName="click-players-main-view"
  data-testid="players-section"
>
  <ft-player-card
    *ngFor="let entry of players | keyvalue; trackBy: trackByPlayerKey"
    [name]="entry.value.name"
    [avatarUrl]="url + entry.value.avatar"
    [color]="entry.value.color"
    [timeRemaining]="entry.value.timeRemaining"
    [state]="getPlayerState(entry.value)"
    (cardClick)="playerClick.emit()"
  ></ft-player-card>
</section>
