<div class="header">
  <img class="logo" src="./assets/icons/family-talk-icon.png" />
  <div class="title">{{ "questions.configureQuestions" | translate }}</div>
</div>

<div class="container">
  <section class="options">
    <button
      *ngFor="let category of categories"
      class="info option"
      [disabled]="numberQuestionsPerCategory[category.name] === 0"
      (click)="setupQuestionCategory(category.name)"
      eventName="change-category"
      [eventPayload]="{ category: category.name }"
    >
      <span class="topic">
        {{ category.name | translate }} ({{
          numberQuestionsPerCategory[category.name]
        }})
        <span class="check-icon" *ngIf="category.name === selectedCategory"
          >✔️</span
        >
      </span>
      <img class="image" [src]="url + category.image" />
    </button>
  </section>
</div>

<div class="footer">
  <button class="primary" (click)="backToGame()">
    {{ "common.return" | translate }}
  </button>
</div>
