<ft-header [title]="'questions.configureQuestions' | translate"></ft-header>

<div class="container">
  <section class="options">
    <ft-button
      *ngFor="let category of categories"
      variant="info"
      [disabled]="numberQuestionsPerCategory[category.name] === 0"
      (buttonClick)="setupQuestionCategory(category.name)"
    >
      <span class="topic">
        {{ category.name | translate }} ({{
          numberQuestionsPerCategory[category.name]
        }})
        <span class="check-icon" *ngIf="category.name === selectedCategory">✔️</span>
      </span>
      <img class="image" [src]="url + category.image" />
    </ft-button>
  </section>
</div>

<div class="footer">
  <ft-button variant="primary" (buttonClick)="backToGame()">{{ "common.return" | translate }}</ft-button>
</div>
