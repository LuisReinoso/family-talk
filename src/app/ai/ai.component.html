<ft-header [title]="'aiConfig.configQuestionGeneration' | translate"></ft-header>

<div class="container">
  <section class="options">
    <form [formGroup]="formGroup" class="ai-form">
      <ft-checkbox
        [label]="'aiConfig.useAiGenerateQuestions' | translate"
        formControlName="hasToUseAi"
      ></ft-checkbox>

      <ft-input
        label="OpenAi Token"
        formControlName="openAiToken"
        placeholder="sk-..."
        [errorMessage]="formGroup.controls['openAiToken'].errors ? 'OpenAi Token ' + ('common.isRequired' | translate) : ''"
      ></ft-input>
    </form>
  </section>
</div>

<div class="footer">
  <ft-button variant="primary" (buttonClick)="backToGame()">{{ "common.return" | translate }}</ft-button>
</div>
