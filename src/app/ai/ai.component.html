<div class="header">
  <img class="logo" src="./assets/icons/family-talk-icon.png" />
  <div class="title">{{ "language.configureLanguage" | translate }}</div>
</div>

<div class="container">
  <section class="options">
    <form [formGroup]="formGroup">
      <label class="checkbox-label-container">
        <span>
          <input
            type="checkbox"
            name="hasToUseAi"
            class="checkbox"
            formControlName="hasToUseAi"
          />
          <span class="custom-checkbox"> </span>
        </span>
        <span class="checkbox-label">{{
          "aiConfig.useAiGenerateQuestions" | translate
        }}</span>
      </label>
      <label for="openAiToken">OpenAi Token</label>
      <input
        type="text"
        formControlName="openAiToken"
        name="openAiToken"
        id="openAiToken"
      />
    </form>
  </section>
</div>

<div class="footer">
  <button class="primary" (click)="backToGame()">
    {{ "common.return" | translate }}
  </button>
</div>
