<ft-header [title]="'language.configureLanguage' | translate"></ft-header>

<div class="container">
  <section class="options">
    <ft-button variant="info" (buttonClick)="setupSpanishAsLanguage()">
      {{ "language.spanish" | translate }}
      <span class="check-icon" *ngIf="currentLanguage === 'es'">✔️</span>
    </ft-button>
    <ft-button variant="info" (buttonClick)="setupEnglishAsLanguage()">
      {{ "language.english" | translate }}
      <span class="check-icon" *ngIf="currentLanguage === 'en'">✔️</span>
    </ft-button>
  </section>
</div>

<div class="footer">
  <ft-button variant="primary" (buttonClick)="backToGame()">{{ "common.return" | translate }}</ft-button>
</div>
