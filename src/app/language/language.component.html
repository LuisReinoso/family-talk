<ft-header [title]="'language.configureLanguage' | translate"></ft-header>

<div class="page-content">
  <div class="lang-grid">
    <button
      class="lang-card"
      [class.lang-card--active]="currentLanguage === 'es'"
      (click)="setupSpanishAsLanguage()"
      eventName="change-language"
      [eventPayload]="{ language: 'es' }"
      data-testid="btn-spanish"
    >
      <span class="lang-card__flag" aria-hidden="true">🇪🇸</span>
      <span class="lang-card__name">Español</span>
      <span class="lang-card__sub">{{ "language.spanish" | translate }}</span>
      <span class="lang-card__check" *ngIf="currentLanguage === 'es'" aria-hidden="true">✔</span>
    </button>

    <button
      class="lang-card"
      [class.lang-card--active]="currentLanguage === 'en'"
      (click)="setupEnglishAsLanguage()"
      eventName="change-language"
      [eventPayload]="{ language: 'en' }"
      data-testid="btn-english"
    >
      <span class="lang-card__flag" aria-hidden="true">🇺🇸</span>
      <span class="lang-card__name">English</span>
      <span class="lang-card__sub">{{ "language.english" | translate }}</span>
      <span class="lang-card__check" *ngIf="currentLanguage === 'en'" aria-hidden="true">✔</span>
    </button>
  </div>
</div>

<section class="footer">
  <ft-button variant="primary" (buttonClick)="backToGame()">{{ "common.return" | translate }}</ft-button>
</section>
