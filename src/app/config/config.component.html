<ft-header [title]="'config.configuration' | translate"></ft-header>

<div class="container">
  <section class="config-options">
    <ft-config-card
      icon="👥"
      [label]="'config.players' | translate"
      accentColor="#4caf50"
      (cardClick)="goToPlayersConfig()"
    ></ft-config-card>
    <ft-config-card
      icon="⚙️"
      [label]="'config.general' | translate"
      accentColor="#ff9800"
      (cardClick)="goToGeneralConfig()"
    ></ft-config-card>
    <ft-config-card
      icon="🌐"
      [label]="'config.language' | translate"
      accentColor="#2196f3"
      (cardClick)="goToLanguageConfig()"
    ></ft-config-card>
    <ft-config-card
      icon="❓"
      [label]="'config.questions' | translate"
      accentColor="#9c27b0"
      (cardClick)="goToQuestionsConfig()"
    ></ft-config-card>
    <ft-config-card
      icon="🤖"
      [label]="'config.ai' | translate"
      accentColor="#6c3ce0"
      (cardClick)="goToAiConfig()"
    ></ft-config-card>
  </section>
</div>

<div class="footer">
  <ft-button variant="primary" (buttonClick)="backToGame()">{{ 'common.return' | translate }}</ft-button>
</div>
